apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

configMapGenerator:
  - name: http-client-config
    literals:
      - APP_ENV=prod

patchesJson6902:
  - target:
      kind: Deployment
      name: http-client
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - URL
          - "https://baidu.com"

